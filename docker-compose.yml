# ====================================================================
# SyncFlow Inventory Sync Service - Docker Compose
# 企业级库存实时同步微服务 - 本地开发与生产部署配置
# ====================================================================

services:
  # ---- 主服务：库存实时同步微服务 ----
  inventory-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncflow-inventory-sync
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # 服务配置
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      # 企业认证配置（预设租户 ID，可通过环境变量覆盖）
      - ENTERPRISE_TOKEN=${ENTERPRISE_TOKEN:-820a85fa-419f-401a-94a8-508391354638}
      # 稳定性配置
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-500}
      - MEMORY_LIMIT_MB=${MEMORY_LIMIT_MB:-384}
      - IDLE_TIMEOUT=${IDLE_TIMEOUT:-300000}
      # 业务流量模拟（生产环境建议开启，模拟正常业务流量）
      - SIMULATE_TRAFFIC=${SIMULATE_TRAFFIC:-true}
      # 管理员 Token（用于 /admin/log-level 动态调整日志级别）
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # SSRF 防护配置
      - ENDPOINT_FILTER=${ENDPOINT_FILTER:-true}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 注：监控/nginx 等附加服务配置已简化，如需启用请参考官方文档
